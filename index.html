<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karasa Ungu</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#f7f0ff;
      color:#3b1b4a;
    }

    header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:15px 30px;
      background:#6a0dad;
      color:white;
    }

    header img{
      height:50px;
    }

    .hero{
      text-align:center;
      padding:50px 20px;
      background:url('original-purple.jpg') center/cover no-repeat;
      color:white;
    }

    .hero h1{
      font-size:40px;
      margin:0;
    }

    .section{
      padding:40px 20px;
      text-align:center;
    }

    .menu{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .card{
      background:white;
      border-radius:15px;
      width:200px;
      padding:15px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .card img{
      width:100%;
      border-radius:10px;
    }

  </style>
</head>

<body>

  <header>
    <img src="logo-karasa.png" alt="Logo Karasa Ungu">
    <h2>Karasa Ungu</h2>
  </header>

  <div class="hero">
    <h1>Es Ubi Ungu Segar</h1>
    <p>Manis, creamy, dan penuh rasa</p>
  </div>

  <div class="section">
    <h2>Menu Kami</h2>

    <div class="menu">

      <div class="card">
        <img src="purple-cheese.jpg" alt="Purple Cheese">
        <h3>Purple Cheese</h3>
      </div>

      <div class="card">
        <img src="purple-choco.jpg" alt="Purple Choco">
        <h3>Purple Choco</h3>
      </div>

      <div class="card">
        <img src="purple-fresh.jpg" alt="Purple Fresh">
        <h3>Purple Fresh</h3>
      </div>

    </div>
  </div>

</body>
</html>
